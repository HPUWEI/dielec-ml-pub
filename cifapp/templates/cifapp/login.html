<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #660874;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #603ea8;
        }
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 50px);
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            padding: 40px 48px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #333;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin: 0 0 28px 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #660874;
            outline: none;
        }
        .error-msg {
            background-color: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 4px;
        }
        button[type="submit"]:hover {
            background-color: #45a049;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .footer-link a {
            color: #660874;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'calculate' %}">Project</a>
        <a href="{% url 'record_list' %}">Database</a>
        <a href="{% url 'ML' %}">ML</a>
        <a href="{% url 'illustration' %}">Support</a>
        <a href="{% url 'about' %}">About</a>
    </div>

    <div class="page-wrapper">
        <div class="card">
            <h1>Sign In</h1>
            <p class="subtitle">Access your personal workspace</p>

            {% if form.errors %}
            <div class="error-msg">
                Incorrect username or password. Please try again.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" id="id_username" name="username" placeholder="Enter username" autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" id="id_password" name="password" placeholder="Enter password">
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit">Sign in</button>
            </form>

            <div class="footer-link">
                No account? <a href="{% url 'register' %}">Create one</a>
            </div>
        </div>
    </div>
</body>
</html>
